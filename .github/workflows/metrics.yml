name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg

          user: pierre1500

          base: header, activity, community, repositories
          config_theme: dark
          config_custom_css: "svg { filter: grayscale(100%); }"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-repos.svg

          user: pierre1500
          base: ""
          config_theme: dark
          config_custom_css: "svg { filter: grayscale(100%); }"

          plugin_repositories: yes
          plugin_repositories_featured: pierre1500/claude-tech-watch,pierre1500/Horizon-yolo-v8,pierre1500/freetakserver-k8s,pierre1500/claude-code