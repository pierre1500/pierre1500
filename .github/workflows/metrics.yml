name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Config de base
          user: pierre1500
          template: classic
          base: header, activity, community, repositories
          
          # Plugins optionnels
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_notable: yes
          plugin_notable_from: organization