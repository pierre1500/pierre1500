name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Config de base
          user: pierre1500
          template: classic
          base: header, activity, community, repositories
          
          # Plugins optionnels
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_repositories: yes
          plugin_repositories_featured: pierre1500/claude-tech-watch,pierre1500/Horizon-yolo-v8,pierre1500/freetakserver-k8s,pierre1500/claude-code
          plugin_repositories_pinned: 4